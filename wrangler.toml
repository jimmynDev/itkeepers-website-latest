name = "itkeepers-website"
compatibility_date = "2026-09-29"
send_metrics = false
main = "worker/index.ts"

[vars]
# Validation-only contact wiring is off in production; no inquiry storage is configured.
CONTACT_VALIDATION_ENABLED = "false"
# Recipient is owner-confirmed. Sender/provider verification, Privacy and controlled
# delivery testing remain open: reject submissions before reading their bodies.
CONTACT_DELIVERY_ENABLED = "false"
CONTACT_ALLOWED_ORIGIN = "https://itkeepers.com"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/contact", "/api/inquiry"]

[[durable_objects.bindings]]
name = "CONTACT_GUARD"
class_name = "InquiryGuard"

[[migrations]]
tag = "inquiry-guard-v1"
new_sqlite_classes = ["InquiryGuard"]

[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "info@itkeepers.com"
# Local development must simulate email. This is NOT the production kill switch;
# CONTACT_DELIVERY_ENABLED=false above remains the delivery gate in production.
remote = false

# CONTACT_EMAIL_FROM must be supplied only after its exact company sender is
# authenticated by Email Service. No sender, secrets or DNS/MX changes are fabricated.
